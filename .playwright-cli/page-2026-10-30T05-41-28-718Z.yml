    - region "What is port 443 used for?" [ref=e38]:
      - heading "What is port 443 used for?" [level=2] [ref=e39]
      - paragraph [ref=e40]: Port 443 is assigned to https and uses TCP / UDP / SCTP. The IANA registry describes the service as “http protocol over TLS/SSL”. It sits in the well-known range, which operating systems reserve for core network services, so software expects it at this number by default.
      - paragraph [ref=e41]:
        - text: Ports are the transport-layer address a service listens on. A client that wants to reach
        - strong [ref=e42]: https
        - text: connects to port 443. A TCP connection is refused when nothing is listening, while a UDP request simply goes unanswered. That is why a port conflict appears whenever two processes try to bind the same number.
      - paragraph [ref=e43]: Use the commands below to confirm whether port 443 is actually in use before you change firewall rules. Blocking the port stops new inbound traffic at the firewall, but it does not stop a local process from listening, and it does not remove the service from the machine.
      - paragraph [ref=e44]:
        - link "Browse all Web and HTTP ports" [ref=e45] [cursor=pointer]:
          - /url: https://example.com/category/web.html
      - paragraph [ref=e46]: "Source: IANA Service Name and Transport Protocol Port Number Registry. Registered assignee: [IESG]. Reference: [RFC 9110]."
    - region "Check and block port 443" [ref=e47]:
      - heading "Check and block port 443" [level=2] [ref=e48]
      - paragraph [ref=e49]: Copy-ready commands for the protocols assigned to this port. Run the check first, then block only what should not be reachable.
      - generic [ref=e50]:
        - generic [ref=e51]:
          - heading "Check on Linux" [level=3] [ref=e53]
          - generic [ref=e54]:
            - code [ref=e55]: sudo ss -tlpn 'sport = :443' sudo ss -ulpn 'sport = :443' sudo ss -Slpn 'sport = :443'
            - button "Copy the Linux check command" [ref=e56] [cursor=pointer]: Copy
        - generic [ref=e57]:
          - heading "Check on Windows" [level=3] [ref=e59]
          - generic [ref=e60]:
            - code [ref=e61]: Get-NetTCPConnection -LocalPort 443 -State Listen -ErrorAction SilentlyContinue Get-NetUDPEndpoint -LocalPort 443 -ErrorAction SilentlyContinue
            - button "Copy the Windows check command" [ref=e62] [cursor=pointer]: Copy
        - generic [ref=e63]:
          - heading "Block with UFW" [level=3] [ref=e65]
          - generic [ref=e66]:
            - code [ref=e67]: sudo ufw deny 443/tcp sudo ufw deny 443/udp
            - button "Copy the UFW block command" [ref=e68] [cursor=pointer]: Copy
        - generic [ref=e69]:
          - heading "Block with iptables" [level=3] [ref=e71]
          - generic [ref=e72]:
            - code [ref=e73]: sudo iptables -A INPUT -p tcp --dport 443 -j DROP sudo iptables -A INPUT -p udp --dport 443 -j DROP sudo iptables -A INPUT -p sctp --dport 443 -j DROP
            - button "Copy the iptables block command" [ref=e74] [cursor=pointer]: Copy
      - paragraph [ref=e75]:
        - text: These commands are examples for a typical host. Check the listener before you change firewall rules, and persist iptables rules with iptables-save or netfilter-persistent. On Windows, use Windows Defender Firewall or
        - code [ref=e76]: New-NetFirewallRule
        - text: for persistent blocks. The iptables rules here cover IPv4; mirror them with
        - code [ref=e77]: ip6tables
        - text: if IPv6 is enabled. UFW and the built-in Windows cmdlets cover TCP and UDP only; this port also lists SCTP, so use nftables, iptables or the vendor's diagnostic tool for those protocols. SCTP and DCCP handling also depends on kernel support, including their diagnostic modules, so a missing result may mean the module is not loaded rather than that nothing is listening.
    - region "Is port 443 safe to expose?" [ref=e78]:
      - heading "Is port 443 safe to expose?" [level=2] [ref=e79]
      - generic [ref=e80]:
        - generic [ref=e81]: Standard/Low
        - paragraph [ref=e82]: This port is not on our curated list of services with a widely exploited profile. Exposure is only safe when the listening service is intended, patched and protected by a firewall. Keep the listening service patched and remove it if unused. A default-deny firewall policy with explicit allow rules is still the safest baseline.
    - region "Where port 443 is usually used" [ref=e83]:
      - heading "Where port 443 is usually used" [level=2] [ref=e84]
      - paragraph [ref=e85]: Most traffic on port 443 falls into these scenarios. The demo below is a safe way to confirm the listener before you change anything.
      - list [ref=e86]:
        - listitem [ref=e87]: Serving a website, API or reverse-proxy traffic that clients reach on port 443.
        - listitem [ref=e88]: Load-balancer and uptime checks probing the port before routing requests.
        - listitem [ref=e89]: Local development, where a browser or curl calls the service on localhost:443.
      - generic [ref=e90]:
        - generic [ref=e91]:
          - generic [ref=e92]: Demo
          - heading "Inspect the TLS certificate" [level=3] [ref=e93]
        - paragraph [ref=e94]: Ask the server for its certificate chain. This works before you have a valid login and shows the hostname the certificate covers.
        - generic [ref=e95]:
          - code [ref=e97]: openssl s_client -connect example.com:443 -servername example.com
          - button "Copy the demo command" [ref=e98] [cursor=pointer]: Copy
    - region "Common problems with port 443" [ref=e99]:
      - heading "Common problems with port 443" [level=2] [ref=e100]
      - generic [ref=e101]:
        - generic [ref=e102]:
          - heading "Connection refused or timed out" [level=3] [ref=e103]
          - paragraph [ref=e104]: Refused usually means the host is reachable but nothing is listening on port 443. A timeout more often means a firewall drop, a wrong host or a service bound to a different interface.
        - generic [ref=e105]:
          - heading "Port already in use" [level=3] [ref=e106]
          - paragraph [ref=e107]:
            - text: Find the process holding the port with
            - code [ref=e108]: sudo ss -tlpn 'sport = :443'
            - text: or
            - code [ref=e109]: sudo lsof -i :443
            - text: . Stop that process or configure it to bind another port; killing it without identifying it can take down a production service.
        - generic [ref=e110]:
          - heading "Firewall rule did not survive a reboot" [level=3] [ref=e111]
          - paragraph [ref=e112]:
            - text: "UFW and Windows Firewall keep rules across restarts. Raw iptables rules do not: save them with"
            - code [ref=e113]: iptables-save
            - text: or the netfilter-persistent package, and re-apply after upgrades that reset the ruleset.
        - generic [ref=e114]:
          - heading "The port is blocked but still reachable" [level=3] [ref=e115]
          - paragraph [ref=e116]:
            - text: A firewall rule filters inbound traffic; it does not close the listener. Confirm with the check command above and bind the service to
            - code [ref=e117]: 127.0.0.1
            - text: when only local clients need it.
